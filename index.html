<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E.L.L.I.E. - Employee Link for Learning, Information & IT Essentials</title>
    <meta name="description" content="E.L.L.I.E. (Employee Link for Learning, Information & IT Essentials) - Lightweight, customizable Uratex IT helpdesk chatbot widget embeddable via a single script tag." />
    <meta property="og:title" content="E.L.L.I.E. - Employee Link for Learning, Information & IT Essentials" />
    <meta property="og:description" content="E.L.L.I.E. IT Helpdesk Chatbot with self-injecting styles, instant embed snippet, and PHP backend integration." />
    <meta property="og:image" content="/ellie.jpeg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <link rel="icon" type="image/jpeg" href="/ellie.jpeg" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <style>
      /* Fallback critical styles preventing any white screen or flash */
      html, body {
        background-color: #0b1120 !important;
        color: #f1f5f9;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }
      @keyframes ellie-pulse {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.05); opacity: 1; }
      }
      @keyframes ellie-spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body class="bg-slate-900 text-slate-100 antialiased min-h-screen" style="background-color: #0b1120; color: #f1f5f9; margin: 0; min-height: 100vh;">
    <div id="root">
      <!-- Branded initial loading skeleton: guarantees the screen is never blank white on Cloudflare -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(circle at 50% 20%, #1e293b 0%, #0b1120 70%); text-align: center; padding: 24px;">
        <div style="position: relative; width: 68px; height: 68px; margin-bottom: 24px;">
          <div style="position: absolute; inset: 0; border: 3px solid rgba(0, 132, 255, 0.2); border-top-color: #0084ff; border-radius: 50%; animation: ellie-spin 0.9s cubic-bezier(0.5, 0.1, 0.5, 0.9) infinite;"></div>
          <div style="width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 26px; color: #0084ff; animation: ellie-pulse 2s infinite ease-in-out;">
            <i class="fa-solid fa-robot"></i>
          </div>
        </div>
        <h1 style="font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin: 0 0 8px 0; color: #ffffff;">
          E.L.L.I.E.
        </h1>
        <p style="font-size: 13.5px; color: #94a3b8; margin: 0 0 16px 0; max-width: 380px; line-height: 1.5;">
          Employee Link for Learning, Information & IT Essentials
        </p>
        <div style="display: inline-flex; align-items: center; gap: 8px; background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.08); padding: 6px 14px; border-radius: 20px; font-size: 12px; color: #38bdf8;">
          <span style="width: 7px; height: 7px; background: #22c55e; border-radius: 50%; display: inline-block;"></span>
          Initializing Cloudflare Edge Workspace...
        </div>
      </div>
    </div>
    <noscript>
      <div style="padding: 30px; text-align: center; color: #ffffff; background: #0b1120;">
        <h2>JavaScript is required to run E.L.L.I.E.</h2>
        <p>Please enable JavaScript in your browser to access the Uratex IT helpdesk suite.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
